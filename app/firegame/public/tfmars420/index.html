<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firegame extension install</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d8dee4;
        --link: #0969da;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        color: var(--link);
        font-weight: 600;
      }

      button {
        font: inherit;
      }

      .copy-button {
        min-height: 40px;
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }

      .copy-button {
        cursor: pointer;
      }

      .copy-button:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      .copy-row {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .copy-row .copy-button {
        min-height: 32px;
        padding: 5px 10px;
      }

      h2 {
        margin: 0 0 12px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        font-size: 18px;
        letter-spacing: 0;
      }

      ol {
        margin: 0;
        padding-left: 24px;
      }

      li {
        margin: 12px 0;
        line-height: 1.5;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #eef1f4;
        color: var(--ink);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.94em;
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Install Firegame extension</h1>
      <h2>Steps</h2>
      <ol>
        <li>
          Download the Firegame source code ZIP from
          <a href="https://github.com/dcep93/firegame/archive/refs/heads/master.zip">GitHub</a>.
        </li>
        <li>Unzip the file.</li>
        <li>
          Visit
          <span class="copy-row">
            <code id="extensions-url">chrome://extensions</code>
            <button class="copy-button" type="button" data-copy-target="extensions-url">
              Copy
            </button>
          </span>
          in Chrome.
        </li>
        <li>
          Click <strong>Load unpacked</strong>, then select the
          <code>extension</code> folder inside the unzipped source code.
        </li>
      </ol>
    </main>
    <script>
      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.top = "-1000px";
        document.body.append(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      };

      document.querySelectorAll("[data-copy-target]").forEach((button) => {
        button.addEventListener("click", async () => {
          const original = button.textContent;
          const copyTarget = document.getElementById(button.dataset.copyTarget);

          try {
            await copyText(copyTarget.textContent);
            button.textContent = "Copied";
          } catch {
            button.textContent = "Copy failed";
          }

          window.setTimeout(() => {
            button.textContent = original;
          }, 1600);
        });
      });
    </script>
  </body>
</html>
